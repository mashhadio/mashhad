# CI for building مشهد (Mashhad) installers.
#
# Linux installers (AppImage + .deb) build automatically on GitLab's shared
# Linux runners whenever you push a version tag (e.g. `git tag v0.1.0 && git push --tags`).
#
# Windows (.exe) and macOS (.dmg) CANNOT be built on Linux runners — they need
# native per-platform modules (uiohook-napi) and OS tooling. Build those on a
# Windows / macOS machine, or register a Windows / macOS runner and enable the
# commented jobs below. App icons (build/icon.png|ico) are committed, so no
# rasterising step is needed here.

stages:
  - build

build:linux:
  stage: build
  image: electronuserland/builder:latest      # node + electron-builder Linux toolchain
  rules:
    - if: '$CI_COMMIT_TAG'                      # only on version tags
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run dist:linux
    # Publish the AppImage/.deb + latest-linux.yml to the public mashhad-releases
    # generic Package Registry so the in-app updater can fetch them. Needs the
    # RELEASES_TOKEN CI/CD variable (masked; api scope + write to mashhad-releases).
    - node scripts/publish-release.js
  artifacts:
    name: "mashhad-linux-${CI_COMMIT_TAG}"
    paths:
      - dist/*.AppImage
      - dist/*.deb
    expire_in: 30 days

