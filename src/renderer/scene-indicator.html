<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>المشهد</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: transparent; overflow: hidden;
      pointer-events: none; user-select: none;
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    #pill {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 5px 12px; border-radius: 999px;
      background: rgba(22, 26, 35, 0.92); color: #f8fafc;
      border: 1px solid rgba(239, 68, 68, 0.55);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      white-space: nowrap; font-weight: 600;
    }
    #dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0.25; } }
  </style>
</head>
<body>
  <div id="pill"><span id="dot"></span><span id="label"></span></div>
  <script src="scene-indicator.js"></script>
</body>
</html>
