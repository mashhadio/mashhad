<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>منطقة التسجيل</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
      pointer-events: none; /* the whole overlay is click-through */
      user-select: none;
      font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    /* The outline drawn around the recorded region. Sized slightly larger than
       the crop so the line sits just outside it. */
    #frame {
      position: fixed;
      display: none;
      border: 3px solid #E23B2E;
      border-radius: 2px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45), 0 0 14px rgba(226, 59, 46, 0.55);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { border-color: #E23B2E; box-shadow: 0 0 0 1px rgba(0,0,0,0.45), 0 0 14px rgba(226,59,46,0.55); }
      50%      { border-color: #F26257; box-shadow: 0 0 0 1px rgba(0,0,0,0.45), 0 0 22px rgba(226,59,46,0.85); }
    }
    /* "● recording" pill anchored to the region. */
    #pill {
      position: fixed;
      display: none;
      align-items: center;
      gap: 7px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(26, 37, 48, 0.92);
      color: #ECF1F6;
      border: 1px solid rgba(226, 59, 46, 0.5);
      white-space: nowrap;
      font-weight: 600;
    }
    #pill .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #E23B2E;
      animation: blink 1.2s steps(1) infinite;
    }
    #pill .size { color: #97A6B6; font-variant-numeric: tabular-nums; }
    @keyframes blink { 50% { opacity: 0.25; } }
  </style>
</head>
<body>
  <div id="frame"></div>
  <div id="pill"><span class="dot"></span><span>جارٍ التسجيل</span><span class="size" id="pillSize"></span></div>
  <script src="rec-frame.js"></script>
</body>
</html>
