<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>تحديد منطقة</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      cursor: crosshair;
      background: transparent;
      user-select: none;
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    /* Full-screen dim shown before the user starts dragging. */
    #backdrop {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.42);
    }
    /* The selection rectangle. Its huge box-shadow dims everything outside it. */
    #sel {
      position: fixed;
      display: none;
      border: 1.5px solid #5E86AE;
      background: rgba(94, 134, 174, 0.10);
      box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.42);
      cursor: move; /* drag inside the box to reposition it */
    }
    /* Resize handles, one per edge + corner; positioned relative to #sel. */
    .handle {
      position: absolute;
      width: 12px;
      height: 12px;
      background: #5E86AE;
      border: 1.5px solid #16202B;
      border-radius: 3px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
    }
    /* While drawing a fresh box the handles would just clutter the corner. */
    #sel.drawing .handle { display: none; }
    .h-nw { left: -6px; top: -6px; cursor: nwse-resize; }
    .h-n  { left: calc(50% - 6px); top: -6px; cursor: ns-resize; }
    .h-ne { right: -6px; top: -6px; cursor: nesw-resize; }
    .h-e  { right: -6px; top: calc(50% - 6px); cursor: ew-resize; }
    .h-se { right: -6px; bottom: -6px; cursor: nwse-resize; }
    .h-s  { left: calc(50% - 6px); bottom: -6px; cursor: ns-resize; }
    .h-sw { left: -6px; bottom: -6px; cursor: nesw-resize; }
    .h-w  { left: -6px; top: calc(50% - 6px); cursor: ew-resize; }
    /* Live width × height readout that follows the selection. */
    #dims {
      position: fixed;
      display: none;
      padding: 3px 8px;
      border-radius: 8px;
      background: #5E86AE;
      color: #fff;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      pointer-events: none;
    }
    /* Confirm / cancel toolbar shown after a drag. */
    #toolbar {
      position: fixed;
      display: none;
      gap: 8px;
      padding: 8px;
      border-radius: 16px;
      background: #1A2530;
      border: 1px solid #33414F;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.5);
    }
    #toolbar button {
      border: 0; border-radius: 12px;
      padding: 8px 16px;
      font-size: 13px; font-weight: 600;
      color: #fff; cursor: pointer;
    }
    #recordBtn { background: #E23B2E; }
    #recordBtn:hover { background: #F05146; }
    #cancelBtn { background: transparent; border: 1px solid #33414F; }
    #cancelBtn:hover { background: #26333F; }
    /* Centered hint shown before any drag. */
    #hint {
      position: fixed;
      left: 50%; top: 48px;
      transform: translateX(-50%);
      padding: 9px 16px;
      border-radius: 999px;
      background: rgba(26, 37, 48, 0.92);
      color: #ECF1F6;
      border: 1px solid #33414F;
      pointer-events: none;
    }
    #hint b { color: #5E86AE; }
  </style>
</head>
<body>
  <div id="backdrop"></div>
  <div id="hint">اسحب لتحديد منطقة &nbsp;·&nbsp; <b>Esc</b> للإلغاء</div>
  <div id="sel"></div>
  <div id="dims"></div>
  <div id="toolbar">
    <button id="recordBtn">● تسجيل المنطقة</button>
    <button id="cancelBtn">إلغاء</button>
  </div>
  <script src="region-overlay.js"></script>
</body>
</html>
