<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>Select area</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      cursor: crosshair;
      background: transparent;
      user-select: none;
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    /* Full-screen dim shown before the user starts dragging. */
    #backdrop {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.42);
    }
    /* The selection rectangle. Its huge box-shadow dims everything outside it. */
    #sel {
      position: fixed;
      display: none;
      border: 1.5px solid #4da3ff;
      background: rgba(77, 163, 255, 0.08);
      box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.42);
    }
    /* Live width × height readout that follows the selection. */
    #dims {
      position: fixed;
      display: none;
      padding: 3px 8px;
      border-radius: 6px;
      background: #4da3ff;
      color: #06223f;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      pointer-events: none;
    }
    /* Confirm / cancel toolbar shown after a drag. */
    #toolbar {
      position: fixed;
      display: none;
      gap: 8px;
      padding: 8px;
      border-radius: 10px;
      background: #111418;
      border: 1px solid #2a2f37;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }
    #toolbar button {
      border: 0; border-radius: 7px;
      padding: 7px 14px;
      font-size: 13px; font-weight: 600;
      color: #fff; cursor: pointer;
    }
    #recordBtn { background: #e5484d; }
    #recordBtn:hover { background: #f2585d; }
    #cancelBtn { background: transparent; border: 1px solid #2a2f37; }
    #cancelBtn:hover { background: #1b1f25; }
    /* Centered hint shown before any drag. */
    #hint {
      position: fixed;
      left: 50%; top: 48px;
      transform: translateX(-50%);
      padding: 9px 16px;
      border-radius: 999px;
      background: rgba(17, 20, 24, 0.92);
      color: #e8eaed;
      border: 1px solid #2a2f37;
      pointer-events: none;
    }
    #hint b { color: #4da3ff; }
  </style>
</head>
<body>
  <div id="backdrop"></div>
  <div id="hint">Drag to select an area &nbsp;·&nbsp; <b>Esc</b> to cancel</div>
  <div id="sel"></div>
  <div id="dims"></div>
  <div id="toolbar">
    <button id="recordBtn">● Record area</button>
    <button id="cancelBtn">Cancel</button>
  </div>
  <script src="region-overlay.js"></script>
</body>
</html>
