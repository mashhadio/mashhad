<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>تحديد منطقة</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      cursor: crosshair;
      background: transparent;
      user-select: none;
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    /* Full-screen dim shown before the user starts dragging. */
    #backdrop {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.42);
    }
    /* The selection rectangle. Its huge box-shadow dims everything outside it. */
    #sel {
      position: fixed;
      display: none;
      border: 1.5px solid #22d3ee;
      background: rgba(34, 211, 238, 0.08);
      box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.42);
    }
    /* Live width × height readout that follows the selection. */
    #dims {
      position: fixed;
      display: none;
      padding: 3px 8px;
      border-radius: 8px;
      background: #22d3ee;
      color: #04222a;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      pointer-events: none;
    }
    /* Confirm / cancel toolbar shown after a drag. */
    #toolbar {
      position: fixed;
      display: none;
      gap: 8px;
      padding: 8px;
      border-radius: 16px;
      background: #161a23;
      border: 1px solid #2a3242;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.5);
    }
    #toolbar button {
      border: 0; border-radius: 12px;
      padding: 8px 16px;
      font-size: 13px; font-weight: 600;
      color: #fff; cursor: pointer;
    }
    #recordBtn { background: #ef4444; }
    #recordBtn:hover { background: #f15a5a; }
    #cancelBtn { background: transparent; border: 1px solid #2a3242; }
    #cancelBtn:hover { background: #1d2430; }
    /* Centered hint shown before any drag. */
    #hint {
      position: fixed;
      left: 50%; top: 48px;
      transform: translateX(-50%);
      padding: 9px 16px;
      border-radius: 999px;
      background: rgba(22, 26, 35, 0.92);
      color: #f8fafc;
      border: 1px solid #2a3242;
      pointer-events: none;
    }
    #hint b { color: #22d3ee; }
  </style>
</head>
<body>
  <div id="backdrop"></div>
  <div id="hint">اسحب لتحديد منطقة &nbsp;·&nbsp; <b>Esc</b> للإلغاء</div>
  <div id="sel"></div>
  <div id="dims"></div>
  <div id="toolbar">
    <button id="recordBtn">● تسجيل المنطقة</button>
    <button id="cancelBtn">إلغاء</button>
  </div>
  <script src="region-overlay.js"></script>
</body>
</html>
